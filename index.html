<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- The Decathlon mark, cut from the lockup the page already carries. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every axis asked for by RANGE, which is the whole point of this line.
         Requested as `wdth,wght@25..151,400..800` the width axis was served
         almost inert — `wdth` 25 bought about 15% of width, so the stickers
         could only be made smaller, never narrower, and the ground claim set
         ~5% wide of the board and lost a line. Asking for `opsz,wdth,wght` over
         their full ranges serves the real variable font: `wdth` 25 now measures
         63% of normal, and the claim's column is back on the board's own
         number. `opsz` is in there because it ships with that font and the
         browser applies it by default anyway — leaving it out of the request
         and on in the renderer is what made the two disagree. -->
    <!-- Barlow Condensed carries the footer's credit card, which is the one
         place on the site that asks for a face Roboto Flex cannot stand in for.
         Its width axis only spans about 11% on this string at 800 — wdth 25
         measures 100.5px where wdth 100 measures 112.9 — so the substitution
         that works for the ground stickers would have meant setting the credit
         a fifth under the size the board gives it. Upright for that credit and
         italic for the persistent shop button, which the board sets in the same
         face leaning. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,800&display=swap"
      rel="stylesheet"
    />
    <title>Anime Sports League — Decathlon</title>
    <meta name="description" content="Anime Sports League by Decathlon." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
